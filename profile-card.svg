<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="850" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&amp;family=Shantell+Sans:wght@500;700;800&amp;display=swap');
      
      .handwritten {
        font-family: 'Comic Neue', 'Shantell Sans', 'Chalkboard SE', 'Comic Sans MS', cursive, sans-serif;
      }
      .user-path {
        fill: #64748B;
        font-size: 22px;
        font-weight: 700;
      }
      .title-bold {
        fill: #0F172A;
        font-size: 32px;
        font-weight: 700;
      }
      .desc-text {
        fill: #475569;
        font-size: 16px;
        font-weight: 400;
      }
      .axis-label {
        fill: #334155;
        font-size: 15px;
        font-weight: 700;
      }
      .axis-num {
        fill: #94A3B8;
        font-size: 11px;
        font-weight: 700;
      }
    </style>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAFA"/>
    </linearGradient>

    <clipPath id="avatarClip">
      <rect x="40" y="120" width="84" height="84" rx="18" />
    </clipPath>
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="5" y="5" width="840" height="310" rx="16" fill="url(#cardBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />

  <!-- LEFT SECTION -->
  <g class="handwritten">
    <!-- Repo Title -->
    <text x="40" y="52" class="user-path">ashutoshb206 /</text>
    <text x="40" y="92" class="title-bold">agentic-ai-engineer</text>

    <!-- Icon Card Container (Centered AI Agent Core Emblem) -->
    <rect x="40" y="120" width="84" height="84" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Centered Glowing AI Agent Emblem -->
    <g transform="translate(60, 140)">
      <!-- Outer Pulsing Orbit Ring -->
      <circle cx="22" cy="22" r="18" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,3"/>
      <!-- Inner Core Node -->
      <circle cx="22" cy="22" r="7" fill="#38BDF8"/>
      <!-- Cardinal Agent Rays -->
      <path d="M22 0v6M22 38v6M0 22h6M38 22h6M6.4 6.4l4.2 4.2M33.4 33.4l4.2 4.2M6.4 37.6l4.2-4.2M33.4 10.6l4.2-4.2" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Description Lines -->
    <text x="142" y="144" class="desc-text">Building multi-agent AI systems,</text>
    <text x="142" y="168" class="desc-text">Gemma &amp; LLM pipelines, and</text>
    <text x="142" y="192" class="desc-text">data analytics &amp; SQL workflows.</text>

    <!-- Single Blue Language Dot -->
    <circle cx="148" cy="216" r="4.5" fill="#3B82F6"/>
    <text x="160" y="220" font-size="15" fill="#64748B">Python &amp; SQL</text>

    <!-- Clean Bottom Role Bar -->
    <text x="40" y="280" font-size="14" fill="#94A3B8">ROLE <tspan font-weight="700" fill="#475569">SDE &amp; GenAI Intern @ INDmoney</tspan>   ·   GRADUATION <tspan font-weight="700" fill="#475569">JULY 2027</tspan></text>
  </g>

  <!-- RIGHT SECTION: RESUME SKILL RADAR CHART -->
  <g class="handwritten" transform="translate(630, 150)">
    <!-- Dashed Pentagon Grid Lines (R = 80, 60, 40, 20) -->
    <!-- R=80 -->
    <polygon points="0,-80 76.1,-24.7 47.0,64.7 -47.0,64.7 -76.1,-24.7" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,4" />
    <!-- R=60 (75%) -->
    <polygon points="0,-60 57.1,-18.5 35.3,48.5 -35.3,48.5 -57.1,-18.5" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="5,4" />
    <!-- R=40 (50%) -->
    <polygon points="0,-40 38.0,-12.4 23.5,32.4 -23.5,32.4 -38.0,-12.4" fill="none" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="4,4" />
    <!-- R=20 (25%) -->
    <polygon points="0,-20 19.0,-6.2 11.8,16.2 -11.8,16.2 -19.0,-6.2" fill="none" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Axes Lines -->
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#CBD5E1" stroke-width="1" />
    <line x1="0" y1="0" x2="76.1" y2="-24.7" stroke="#CBD5E1" stroke-width="1" />
    <line x1="0" y1="0" x2="47.0" y2="64.7" stroke="#CBD5E1" stroke-width="1" />
    <line x1="0" y1="0" x2="-47.0" y2="64.7" stroke="#CBD5E1" stroke-width="1" />
    <line x1="0" y1="0" x2="-76.1" y2="-24.7" stroke="#CBD5E1" stroke-width="1" />

    <!-- Axis Scale Numbers -->
    <text x="4" y="-18" class="axis-num">25</text>
    <text x="4" y="-38" class="axis-num">50</text>
    <text x="4" y="-58" class="axis-num">75</text>

    <!-- REALISTIC SKILL POLYGON -->
    <path d="M 0 -73.6 Q 35 -45 66.9 -21.8 Q 52 15 36.7 50.5 Q 0 52 -38.5 53.1 Q -48 15 -60.9 -19.8 Q -30 -45 0 -73.6 Z" 
          fill="#22C55E" fill-opacity="0.22" stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Green Vertex Dots -->
    <circle cx="0" cy="-73.6" r="4" fill="#16A34A" />
    <circle cx="66.9" cy="-21.8" r="4" fill="#16A34A" />
    <circle cx="36.7" cy="50.5" r="4" fill="#16A34A" />
    <circle cx="-38.5" cy="53.1" r="4" fill="#16A34A" />
    <circle cx="-60.9" cy="-19.8" r="4" fill="#16A34A" />

    <!-- Positioned Axis Labels -->
    <text x="0" y="-94" class="axis-label" text-anchor="middle">Agentic AI</text>
    <text x="90" y="-20" class="axis-label" text-anchor="start">GenAI &amp; LLMs</text>
    <text x="55" y="85" class="axis-label" text-anchor="start">Backend &amp; APIs</text>
    <text x="-55" y="85" class="axis-label" text-anchor="end">Data Analytics</text>
    <text x="-90" y="-20" class="axis-label" text-anchor="end">SQL &amp; Databases</text>
  </g>

  <!-- Bottom Right Branding -->
  <g transform="translate(815, 295)" class="handwritten">
    <text x="0" y="0" font-size="11" fill="#94A3B8" text-anchor="end">ashutoshb206 · github profile</text>
  </g>
</svg>
