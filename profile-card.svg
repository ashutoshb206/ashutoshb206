<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="850" height="280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&amp;family=Shantell+Sans:wght@500;700;800&amp;display=swap');
      
      .handwritten {
        font-family: 'Comic Neue', 'Shantell Sans', 'Chalkboard SE', 'Comic Sans MS', cursive, sans-serif;
      }
      .user-path {
        fill: #64748B;
        font-size: 22px;
        font-weight: 700;
      }
      .title-bold {
        fill: #0F172A;
        font-size: 32px;
        font-weight: 700;
      }
      .desc-text {
        fill: #475569;
        font-size: 16px;
        font-weight: 400;
      }
      .badge-title {
        fill: #0F172A;
        font-size: 16px;
        font-weight: 700;
      }
    </style>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAFA"/>
    </linearGradient>
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="5" y="5" width="840" height="270" rx="16" fill="url(#cardBg)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />

  <g class="handwritten">
    <!-- LEFT COLUMN: Profile & Bio -->
    <text x="40" y="52" class="user-path">ashutoshb206 /</text>
    <text x="40" y="92" class="title-bold">agentic-ai-engineer</text>

    <!-- Icon Card Container -->
    <rect x="40" y="116" width="76" height="76" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Centered Glowing AI Agent Emblem -->
    <g transform="translate(56, 132)">
      <circle cx="22" cy="22" r="18" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,3"/>
      <circle cx="22" cy="22" r="7" fill="#38BDF8"/>
      <path d="M22 0v6M22 38v6M0 22h6M38 22h6M6.4 6.4l4.2 4.2M33.4 33.4l4.2 4.2M6.4 37.6l4.2-4.2M33.4 10.6l4.2-4.2" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Description Lines -->
    <text x="134" y="138" class="desc-text">Building multi-agent AI systems,</text>
    <text x="134" y="162" class="desc-text">Gemma &amp; LLM pipelines, and</text>
    <text x="134" y="186" class="desc-text">data analytics &amp; SQL workflows.</text>

    <!-- Single Blue Language Dot -->
    <circle cx="140" cy="210" r="4.5" fill="#3B82F6"/>
    <text x="152" y="214" font-size="15" fill="#64748B">Python &amp; SQL</text>

    <!-- Clean Bottom Role Bar -->
    <text x="40" y="250" font-size="14" fill="#94A3B8">ROLE <tspan font-weight="700" fill="#475569">SDE &amp; GenAI Intern @ INDmoney</tspan>   ·   GRADUATION <tspan font-weight="700" fill="#475569">JULY 2027</tspan></text>

    <!-- RIGHT COLUMN: Highlight Cards -->
    <g transform="translate(560, 45)">
      <!-- Highlight Card 1: Agentic AI -->
      <rect x="0" y="0" width="240" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <circle cx="30" cy="30" r="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
      <path d="M25 30l3 3 7-7" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="28" class="badge-title">Agentic AI &amp; LLMs</text>
      <text x="56" y="46" font-size="13" fill="#64748B">Multi-Agent Orchestration</text>

      <!-- Highlight Card 2: Data & SQL -->
      <rect x="0" y="75" width="240" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <circle cx="30" cy="105" r="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <path d="M25 105l3 3 7-7" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="103" class="badge-title">Data Analytics &amp; SQL</text>
      <text x="56" y="121" font-size="13" fill="#64748B">ETL, Databricks &amp; EDA</text>

      <!-- Highlight Card 3: Backend & APIs -->
      <rect x="0" y="150" width="240" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <circle cx="30" cy="180" r="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
      <path d="M25 180l3 3 7-7" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="178" class="badge-title">FastAPI &amp; Backend</text>
      <text x="56" y="196" font-size="13" fill="#64748B">SSE &amp; Scalable Microservices</text>
    </g>
  </g>
</svg>
