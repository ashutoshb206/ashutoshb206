<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" style="background: #FFFFFF;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&amp;family=Shantell+Sans:wght@500;700;800&amp;display=swap');

      .handwritten {
        font-family: 'Comic Neue', 'Shantell Sans', 'Comic Sans MS', cursive, sans-serif;
      }
      .radar-title {
        fill: #0F172A;
        font-size: 21px;
        font-weight: 700;
      }
      .axis-label {
        fill: #1E293B;
        font-size: 15px;
        font-weight: 700;
      }
      .scale-num {
        fill: #475569;
        font-size: 13px;
        font-weight: 700;
      }
    </style>
  </defs>

  <g class="handwritten">
    <!-- Title -->
    <text x="300" y="36" class="radar-title" text-anchor="middle">ashutoshb206 / skill-radar</text>

    <!-- Radar Grid Group (Centered at x=300, y=240) -->
    <g transform="translate(300, 240)">

      <!-- Dashed Pentagon Rings (R = 160, 120, 80, 40) -->
      <!-- R=160 (Scale 10) -->
      <polygon points="0,-160 152.2,-49.4 94.0,129.4 -94.0,129.4 -152.2,-49.4" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" />
      
      <!-- R=120 (Scale 7.5) -->
      <polygon points="0,-120 114.1,-37.1 70.5,97.1 -70.5,97.1 -114.1,-37.1" fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="5,4" />
      
      <!-- R=80 (Scale 5) -->
      <polygon points="0,-80 76.1,-24.7 47.0,64.7 -47.0,64.7 -76.1,-24.7" fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5,4" />
      
      <!-- R=40 (Scale 2.5) -->
      <polygon points="0,-40 38.0,-12.4 23.5,32.4 -23.5,32.4 -38.0,-12.4" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4,4" />

      <!-- Radial Axis Lines -->
      <line x1="0" y1="0" x2="0" y2="-160" stroke="#475569" stroke-width="1.2" />
      <line x1="0" y1="0" x2="152.2" y2="-49.4" stroke="#475569" stroke-width="1.2" />
      <line x1="0" y1="0" x2="94.0" y2="129.4" stroke="#475569" stroke-width="1.2" />
      <line x1="0" y1="0" x2="-94.0" y2="129.4" stroke="#475569" stroke-width="1.2" />
      <line x1="0" y1="0" x2="-152.2" y2="-49.4" stroke="#475569" stroke-width="1.2" />

      <!-- Scale Numbers (0, 2, 4, 6, 8) along top axis -->
      <text x="6" y="-5" class="scale-num">0</text>
      <text x="6" y="-32" class="scale-num">2</text>
      <text x="6" y="-64" class="scale-num">4</text>
      <text x="6" y="-96" class="scale-num">6</text>
      <text x="6" y="-128" class="scale-num">8</text>

      <!-- RED SKETCHY SKILL POLYGON (Agentic AI 9.2, GenAI 8.8, Backend 7.8, Data Analytics 8.2, SQL & DBs 8.0) -->
      <path d="M 0 -147.2 C 55 -95, 100 -70, 133.9 -43.5 C 115 10, 90 55, 73.3 100.9 C 10 105, -35 105, -77.1 106.1 C -98 45, -112 -10, -121.8 -39.5 C -70 -90, -35 -115, 0 -147.2 Z" 
            fill="#F87171" fill-opacity="0.3" stroke="#DD4528" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Red Vertex Nodes -->
      <circle cx="0" cy="-147.2" r="4.5" fill="#DD4528" stroke="#991B1B" stroke-width="1" />
      <circle cx="133.9" cy="-43.5" r="4.5" fill="#DD4528" stroke="#991B1B" stroke-width="1" />
      <circle cx="73.3" cy="100.9" r="4.5" fill="#DD4528" stroke="#991B1B" stroke-width="1" />
      <circle cx="-77.1" cy="106.1" r="4.5" fill="#DD4528" stroke="#991B1B" stroke-width="1" />
      <circle cx="-121.8" cy="-39.5" r="4.5" fill="#DD4528" stroke="#991B1B" stroke-width="1" />

      <!-- Axis Text Labels -->
      <text x="0" y="-175" class="axis-label" text-anchor="middle">Agentic AI</text>
      <text x="166" y="-45" class="axis-label" text-anchor="start">GenAI &amp; LLMs</text>
      <text x="105" y="152" class="axis-label" text-anchor="start">Backend &amp; APIs</text>
      <text x="-105" y="152" class="axis-label" text-anchor="end">Data Analytics</text>
      <text x="-166" y="-45" class="axis-label" text-anchor="end">SQL &amp; DBs</text>

    </g>
  </g>
</svg>