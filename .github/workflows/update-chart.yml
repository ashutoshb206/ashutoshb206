name: Update Hand-Drawn Contribution Chart

on:
  schedule:
    # Automatically run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Live Data & Generate Chart SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tune_side_by_side.js

      - name: Commit & Push Updated Contribution Chart
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add contribution-chart.svg xkcd-radar.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update live contribution chart [skip ci]" && git push)

