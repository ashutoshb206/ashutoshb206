<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" style="background: #FFFFFF;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&amp;family=Shantell+Sans:wght@500;700;800&amp;display=swap');

      .handwritten {
        font-family: 'Comic Neue', 'Shantell Sans', 'Comic Sans MS', cursive, sans-serif;
      }
      .chart-title {
        fill: #0F172A;
        font-size: 21px;
        font-weight: 700;
      }
      .axis-label {
        fill: #334155;
        font-size: 15px;
        font-weight: 700;
      }
      .axis-num {
        fill: #64748B;
        font-size: 13px;
        font-weight: 700;
      }
      .stat-num {
        fill: #DC2626;
        font-size: 13px;
        font-weight: 700;
        opacity: 0.85;
        transition: opacity 0.2s ease, font-size 0.2s ease;
      }
      .node-group {
        cursor: pointer;
      }
      .tooltip-box {
        opacity: 0;
        transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
        pointer-events: none;
      }
      .node-group:hover .tooltip-box {
        opacity: 1;
      }
      .node-dot {
        transition: r 0.2s ease, fill 0.2s ease;
      }
      .node-group:hover .node-dot {
        r: 8;
        fill: #991B1B;
      }
      .node-group:hover .stat-num {
        opacity: 1;
        font-size: 15px;
        fill: #991B1B;
      }
    </style>
  </defs>

