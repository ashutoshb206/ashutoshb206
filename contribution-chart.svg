      <g class="tooltip-box" transform="translate(155, 330.5)">
        <rect x="-80" y="-16" width="160" height="30" rx="5" fill="#0F172A" fill-opacity="0.95" />
        <text x="0" y="4" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Feb 2026: +85 (88 Total)</text>
      </g>
    </g>

    <g class="node-group">
