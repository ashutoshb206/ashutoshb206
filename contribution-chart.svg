      <circle cx="80" cy="408.6" r="5" class="node-dot" fill="#DC2626"/>
      <g class="tooltip-box" transform="translate(80, 370.6)">
        <rect x="-80" y="-16" width="160" height="30" rx="5" fill="#0F172A" fill-opacity="0.95" />
        <text x="0" y="4" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Jan 2026: +3 (3 Total)</text>
      </g>
    </g>

    <g class="node-group">
