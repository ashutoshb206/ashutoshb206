        <text x="0" y="4" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Apr 2026: +115 (315 Total)</text>
      </g>
    </g>

    <g class="node-group">
      <title>May 2026: +8 commits (323 total)</title>
      <text x="380" y="245.7" class="stat-num" text-anchor="middle">323</text>
      <circle cx="380" cy="257.7" r="5" class="node-dot" fill="#DC2626"/>
      <g class="tooltip-box" transform="translate(380, 219.7)">
        <rect x="-80" y="-16" width="160" height="30" rx="5" fill="#0F172A" fill-opacity="0.95" />
        <text x="0" y="4" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">May 2026: +8 (323 Total)</text>
      </g>
    </g>

    <g class="node-group">
      <title>Jun 2026: +44 commits (367 total)</title>
      <text x="455" y="225.0" class="stat-num" text-anchor="middle">367</text>
      <circle cx="455" cy="237.0" r="5" class="node-dot" fill="#DC2626"/>
      <g class="tooltip-box" transform="translate(455, 199.0)">
        <rect x="-80" y="-16" width="160" height="30" rx="5" fill="#0F172A" fill-opacity="0.95" />
        <text x="0" y="4" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Jun 2026: +44 (367 Total)</text>
      </g>
    </g>

    <g class="node-group">
      <title>Jul 2026: +260 commits (627 total)</title>
      <text x="530" y="102.4" class="stat-num" text-anchor="middle">627</text>
      <circle cx="530" cy="114.4" r="7" class="node-dot" fill="#DC2626"/>
      <g class="tooltip-box" transform="translate(450, 76.4)">
        <rect x="-85" y="-16" width="170" height="30" rx="5" fill="#0F172A" fill-opacity="0.95" stroke="#DC2626" stroke-width="1.5"/>
        <text x="0" y="4" font-size="12" font-weight="700" fill="#22C55E" text-anchor="middle">Jul 2026: +260 (627 Total!)</text>
      </g>
    </g>

  </g>
</svg>